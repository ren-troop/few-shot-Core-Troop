# MAML on CIFAR-FS, 5-way 5-shot.
seed: 0

dataset:
  name: cifar-fs
  root: data
  image_size: 32
  n_way: 5
  n_shot: 5
  n_query: 15
  cache_images: true
  mean: [0.5071, 0.4866, 0.4409]
  std: [0.2673, 0.2564, 0.2762]

model:
  hidden: 64
  norm: group

algorithm:
  name: maml
  inner_steps: 5
  inner_lr: 0.01
  first_order: false

train:
  output_dir: runs/cifarfs_maml
  meta_batch_size: 4
  meta_iters: 10000
  meta_lr: 0.001
  weight_decay: 0.0
  lr_schedule: constant
  eval_every: 500
  eval_tasks: 100
  log_every: 50
  save_every: 1000
  grad_clip: 10.0
