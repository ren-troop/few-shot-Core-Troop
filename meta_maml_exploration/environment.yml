# Optional new CPU environment. Prefer an existing working Conda environment.
name: meta-maml-explore
channels:
  - pytorch
  - defaults
dependencies:
  - python=3.11
  - pytorch=2.5.1
  - torchvision=0.20.1
  - cpuonly
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.2
  - matplotlib>=3.7
  - pillow
